name: Android CI - Build APK & AAB

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 3. Install NPM Dependencies
        run: |
          npm install

      - name: 4. Build Web Application Assets
        run: |
          npm run build

      - name: 5. Sync Capacitor Android Platform
        run: |
          npx cap sync android

      - name: 6. Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 7. Generate Release Keystore for Signing
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v \
              -keystore android/app/release.keystore \
              -alias blockblaster \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass blockblaster123 \
              -keypass blockblaster123 \
              -dname "CN=BlockBlaster, OU=Games, O=BlockBlaster, L=Mumbai, S=MH, C=IN"
          fi

      - name: 8. Make Gradle Executable
        run: |
          chmod +x ./android/gradlew

      - name: 9. Compile Android APK & AAB Packages
        run: |
          cd android
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace

      - name: 10. Prepare Release Files
        run: |
          mkdir -p release-files
          
          # Direct install APK (Mobile testing)
          if [ -f android/app/build/outputs/apk/debug/app-debug.apk ]; then
            cp android/app/build/outputs/apk/debug/app-debug.apk release-files/BlockBlaster-Direct-Install.apk
          fi

          # Signed Release APK
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk release-files/BlockBlaster-Release.apk
          elif [ -f android/app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk release-files/BlockBlaster-Release.apk
          fi

          # AAB Bundle (Indus Appstore Console)
          if [ -f android/app/build/outputs/bundle/release/app-release.aab ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab release-files/BlockBlaster-IndusStore.aab
          fi

          ls -la release-files

      - name: 11. Upload Artifacts to Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: Android-Build-Artifacts
          path: release-files/*
          retention-days: 30

      - name: 12. Publish Direct APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: "v1.0.0"
          name: "Block Blaster - Official Android APK (v1.0.0)"
          body: |
            ### 🎮 Block Blaster - Native Android Build

            - 📲 **BlockBlaster-Direct-Install.apk** : Direct phone install APK.
            - 📲 **BlockBlaster-Release.apk** : Signed Release APK.
            - ⭐️ **BlockBlaster-IndusStore.aab** : Indus Appstore Developer Console bundle.
          files: |
            release-files/BlockBlaster-Direct-Install.apk
            release-files/BlockBlaster-Release.apk
            release-files/BlockBlaster-IndusStore.aab
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
